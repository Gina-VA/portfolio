<style id="css">
/* Layout: single column résumé-page, sections read like a tester's checklist (case ID · task · status) */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --fg:#15211E; --muted:#56655F; --line:#D9E1DD;
  --accent:#0E6B62; --accent-soft:#DDEEEA; --warm:#B4531A; --pass:#1C7C3A; --danger:#B42318;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#16201D; --fg:#E6EEEB; --muted:#9AAAA4; --line:#26332F;
  --accent:#4FC2B3; --accent-soft:#1B3330; --warm:#F0A064; --pass:#6FD28C; --danger:#F97066; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#16201D; --fg:#E6EEEB; --muted:#9AAAA4; --line:#26332F;
  --accent:#4FC2B3; --accent-soft:#1B3330; --warm:#F0A064; --pass:#6FD28C; --danger:#F97066; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.6;margin:0}
.wrap{max-width:960px;margin:0 auto;padding-inline:20px;padding-block:40px 110px;display:flex;flex-direction:column;gap:72px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
section{display:flex;flex-direction:column;gap:24px}
.sec-head{display:flex;flex-direction:column;gap:8px;max-width:62ch}

.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:end;padding-top:16px}
.hero h1{font-size:clamp(2.4rem,6.5vw,4.4rem);font-weight:800;letter-spacing:-.02em;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:1.15rem;max-width:52ch;margin-top:18px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{font:600 .95rem var(--body);padding:12px 20px;border-radius:999px;border:1.5px solid var(--accent);background:var(--accent);color:var(--bg);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.idcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;font-size:.92rem}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.pic{margin:0;width:100%;max-width:340px;align-self:center}
.pic svg{display:block;width:100%;height:auto}
.pic{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pic svg{transition:transform .4s cubic-bezier(.2,.8,.2,1);overflow:visible}
.pic .me,.pic .lap{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.pic:hover svg,.pic:focus-visible svg{transform:translateY(-6px) scale(1.04)}
.pic:hover .me,.pic:focus-visible .me{transform:translateY(-8px)}
.pic:hover .lap,.pic:focus-visible .lap{transform:translateY(3px)}
@media (prefers-reduced-motion:reduce){.pic svg,.pic .me,.pic .lap{transition:none}.pic:hover svg,.pic:hover .me,.pic:hover .lap{transform:none}}
.idcard .name{font-family:var(--display);font-size:1.35rem;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0}
.tag{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

.bridge{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bridge > div{background:var(--surface);padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.bridge .from{font-family:var(--mono);font-size:.78rem;color:var(--warm)}

.cases{border-top:1px solid var(--line)}
.case{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:18px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);position:relative}
.case .id{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.case p{color:var(--muted);margin-top:4px;max-width:60ch}
.status{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.08em;color:var(--pass);white-space:nowrap}
.status::before{content:"✓ "}

.exp{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}
.exp-side{display:flex;flex-direction:column;gap:6px}
.exp-side .role{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.2}
.exp ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.exp li{position:relative}
.domains{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.domain{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.domain p{font-size:.9rem;color:var(--muted)}
.domain .va{font-size:.85rem;border-top:1px dashed var(--line);padding-top:8px;margin-top:auto;display:flex;flex-direction:column}
.domain .va small{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--warm);font-weight:600}

.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.skills > div{position:relative;min-width:0}
.skills ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.skills li{padding-left:18px;position:relative}
.skills li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border:1.5px solid var(--accent);border-radius:2px}

.quotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
blockquote{margin:0;padding:22px;border-left:3px solid var(--warm);background:var(--surface);border-radius:0 12px 12px 0;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
blockquote p{font-size:1.02rem}
.quotes blockquote:first-child:nth-last-child(odd){grid-column:1/-1}
blockquote cite a{color:inherit;text-decoration:underline;text-underline-offset:3px}
blockquote cite{font-style:normal;font-family:var(--mono);font-size:.78rem;color:var(--muted)}

.contact{background:var(--accent);color:var(--bg);border-radius:18px;padding:36px 28px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.contact h2{color:var(--bg);font-size:clamp(1.8rem,4vw,2.5rem)}
.contact p{opacity:.9;margin-top:10px}
.clist{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(0,0,0,.14);border-radius:10px;padding:10px 14px;min-width:0;position:relative}
.crow > div{min-width:0}
.crow .v{font-family:var(--mono);font-size:.9rem;overflow-wrap:anywhere}
.crow small{display:block;font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.copy{font:600 .75rem var(--body);background:var(--bg);color:var(--accent);border:0;border-radius:999px;padding:6px 12px;cursor:pointer;flex-shrink:0}
footer{font-size:.85rem;color:var(--muted);text-align:center}

/* Edit mode */
.toolbar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:10;max-width:calc(100% - 32px);flex-wrap:wrap}
.toolbar .btn{padding:8px 16px;font-size:.85rem}
.toolbar .msg{font-size:.8rem;color:var(--muted);padding:0 8px}
body.editing [data-k]{outline:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:3px;cursor:text;min-width:1ch}
body.editing [data-k]:focus{outline:2px solid var(--accent);background:var(--accent-soft)}
body.editing .contact [data-k]{outline-color:color-mix(in srgb,var(--bg) 70%,transparent)}
body.editing .contact [data-k]:focus{background:rgba(0,0,0,.2)}
.ed{display:none}
body.editing .ed{display:inline-flex}
.del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--danger);font:600 .9rem var(--body);align-items:center;justify-content:center;cursor:pointer;z-index:2}
.add{font:600 .8rem var(--body);color:var(--accent);background:transparent;border:1.5px dashed var(--accent);border-radius:999px;padding:6px 14px;cursor:pointer;align-self:flex-start;margin-top:4px}
.contact .add{color:var(--bg);border-color:var(--bg)}
.hint{font-size:.85rem;background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:10px 14px}

@media (max-width:760px){
  .hero,.exp,.contact{grid-template-columns:1fr}
  .domains,.skills{grid-template-columns:1fr 1fr}
  .quotes,.bridge{grid-template-columns:1fr}
}
@media (max-width:480px){
  .domains,.skills{grid-template-columns:1fr}
  .case{grid-template-columns:1fr auto;gap:4px 12px}
  .case .id{grid-column:1/-1}
}
/* Hover effects */
.btn,.idcard,.bridge > div,.case,.domain,blockquote,.crow,.skills li,.copy{transition:transform .25s ease,box-shadow .25s ease,background-color .25s ease,border-color .25s ease,color .25s ease}
.case{padding-inline:8px;margin-inline:-8px;border-radius:10px}
@media (hover:hover){
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(14,107,98,.28)}
.btn.ghost:hover{background:var(--accent);color:var(--bg)}
.idcard:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.10);border-color:var(--accent)}
.bridge > div:hover{background:var(--accent-soft)}
.bridge > div:hover h3{color:var(--accent)}
.case:hover{background:var(--accent-soft)}
.case:hover h3{color:var(--accent)}
.domain:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 12px 26px rgba(0,0,0,.10)}
.domain:hover h3{color:var(--accent)}
blockquote:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(0,0,0,.10);border-left-color:var(--accent)}
.skills li:hover{color:var(--accent);transform:translateX(4px)}
.skills li:hover::before{background:var(--accent)}
.crow:hover{background:rgba(0,0,0,.26)}
.copy:hover{transform:scale(1.06)}
}
@media (prefers-reduced-motion:reduce){.btn,.idcard,.bridge > div,.case,.domain,blockquote,.crow,.skills li,.copy{transition:none}.btn:hover,.idcard:hover,.domain:hover,blockquote:hover,.skills li:hover,.copy:hover{transform:none}}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

  if(b.dataset.add){get(b.dataset.add).push(JSON.parse(JSON.stringify(tpl(b.dataset.add))));mark();render();return}
  if(b.dataset.copy){var v=S.contact.rows[+b.dataset.copy].value;var done=function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1500)};
    var sel=function(){var s=b.parentNode.querySelector('.v');var r=document.createRange();r.selectNodeContents(s);var w=getSelection();w.removeAllRanges();w.addRange(r);b.textContent='Selected'};
    try{navigator.clipboard.writeText(v.replace(/\s(?=\d)/g,'')).then(done,sel)}catch(x){sel()}return}
  if(b.id==='edit'){editing=true;dirty=false;render();return}
  if(b.id==='cancel'){S=JSON.parse(JSON.stringify(saved));editing=false;dirty=false;render();return}
  if(b.id==='save'){save(b)}
});

function buildDoc(){
  var resetEl=document.head&&document.head.querySelector('style');
  var reset=resetEl?resetEl.textContent:'';
  var json=JSON.stringify(S,null,1).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>'+esc(document.title)+'</title>'+FONTS+
    '<style id="css">'+document.getElementById('css').textContent+'</style>'+
    '<div id="app"></div>'+
    '<script type="application/json" id="state">'+json+'<\/script>'+
    '<script id="app-js">'+document.getElementById('app-js').textContent+'<\/script>'+
    '</body></html>';
}
function save(btn){
  if(!dirty){editing=false;render();return}
  var m=document.getElementById('msg');btn.disabled=true;if(m)m.textContent='Saving…';
  api.publish(buildDoc()).then(function(){if(m)m.textContent='Saved'},function(err){
    btn.disabled=false;var c=err&&err.code;
    if(c==='conflict'){if(m)m.textContent='A newer version was saved. Reloading…'}
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'||c==='consent_required'){api=null;editing=false;render()}
    else if(c==='rate_limited'){if(m)m.textContent='Saving too often. Wait a moment, then press Save.'}
    else if(c==='too_large'){if(m)m.textContent='The page is too large to save. Remove some items.'}
    else{if(m)m.textContent='Could not save. Press Save to try again.'}
  });
}

render();
if(window.claude&&window.claude.use){
  window.claude.use('artifact').then(function(a){
    if(!a)return;
    var ok=function(yes){if(yes){api=a;render()}};
    window.claude.use('user').then(function(u){if(u&&u.canEdit)u.canEdit().then(ok,function(){ok(true)});else ok(true)},function(){ok(true)});
  },function(){});
}
})();
</script>
